<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: url("https://source.unsplash.com/1600x900/?movie,cinema")
          no-repeat center center fixed;
        background-size: cover;
      }
      .overlay {
        background-color: rgba(0, 0, 0, 0.6);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .login-box {
        position: relative;
        width: 350px;
        margin: 100px auto;
        background: rgba(0, 0, 0, 0.75);
        padding: 40px;
        border-radius: 8px;
        color: #fff;
      }
      .login-box h2 {
        margin-bottom: 20px;
        font-weight: bold;
      }
      .login-box input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 4px;
      }
      .login-box button {
        width: 100%;
        padding: 12px;
        background: #e50914;
        border: none;
        border-radius: 4px;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
      }
      .login-box button:hover {
        background: #f6121d;
      }
      .login-box .options {
        margin-top: 15px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
      }
      .login-box a {
        color: #b3b3b3;
        text-decoration: none;
      }
      .login-box a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="overlay"></div>
    <div class="login-box">
      <h2>Đăng nhập</h2>
      <form id="form">
        <input type="email" placeholder="Email" id="email" required />
        <input type="password" placeholder="Mật khẩu" id="password" required />
        <button type="submit">Đăng nhập</button>
        <div class="options">
          <label><input type="checkbox" /> Ghi nhớ tôi</label>
          <a href="#">Bạn cần trợ giúp?</a>
        </div>
      </form>
      <!-- -------------------------------------------------------------------- -->
      <script>
        const pass = document.getElementById("password");
        document
          .getElementById("form")
          .addEventListener("submit", function (event) {
            event.preventDefault();
            let passValue = pass.value;
            console.log(passValue);
            if (passValue.length <= 6) {
              alert("password must be atleast 6 characters");
            } else {
              alert("1");
            }
          });
      </script>
    </div>
  </body>
</html>

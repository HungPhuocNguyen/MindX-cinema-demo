<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" placeholder="username" id="name" /> <br />
    <br />
    <input type="email" placeholder="email" id="email" /> <br />
    <br />
    <input type="password" placeholder="password" id="pass" />
    <button id="button">sign</button>
    <p id="printer"></p>
    <script>
      const button = document.getElementById("button");
      button.addEventListener("click", function () {
        let user = document.getElementById("name");
        let username = user.value;
        let p = document.getElementById("printer");
        console.log(username.length);
        if (username.length < 6) {
          p.innerHTML = "the username must have more than 6 characters";
          p.style.color = "Red";
        } else {
          p.innerHTML = "the username is " + username;
        }
      });
    </script>
  </body>
</html>
